name: FastAPI PostgreSQL tests

on:
  pull_request:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dhtrails
          POSTGRES_PASSWORD: dhtrails_local_only
          POSTGRES_DB: dhtrails
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U dhtrails -d dhtrails"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 15
    env:
      DATABASE_URL: postgresql+psycopg://dhtrails:dhtrails_local_only@localhost:5432/dhtrails
      SECRET_KEY: 0123456789012345678901234567890123456789_ci_only
      GPS_STORAGE_DIR: /tmp/dhtrails-test-gps
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install FastAPI dependencies
        run: python -m pip install -r requirements.txt email-validator
      - name: Validate database migration
        run: alembic upgrade head
      - name: Run API and database tests
        run: python -m pytest -q
      - name: Check installed schema against SQLAlchemy models
        run: alembic check
