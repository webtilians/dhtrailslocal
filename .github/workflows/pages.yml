name: Deploy GitHub Pages

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          test -s index.html
          test -s entrenamiento.html
          test -s circuitos.html
          test -s torneos.html
          test -s editor.html
          test -s competicion.html
          test -s app.css
          test -s app-shell.mjs
          test -s timetrial.mjs
          test -s entrenamiento.mjs
          test -s circuitos.mjs
          test -s torneos.mjs
          test -s telemetry.mjs
          test -s charts.mjs
          test -s gps-engine.mjs
          test -s api-client.mjs
          test -s sector-comparison.mjs
          test -s competition-core.mjs
          mkdir -p _site
          cp index.html entrenamiento.html circuitos.html torneos.html editor.html competicion.html app.css app-shell.mjs timetrial.mjs entrenamiento.mjs circuitos.mjs torneos.mjs telemetry.mjs charts.mjs gps-engine.mjs api-client.mjs sector-comparison.mjs competition-core.mjs _site/
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
